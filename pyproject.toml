[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wirebrain-local"
version = "0.1.0"
description = "Local-first AI conversation diary with semantic memory search and MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []
keywords = ["ai-memory", "chatgpt", "claude", "local-first", "semantic-search", "mcp", "conversation-history"]

[project.urls]
Homepage = "https://saireddybv.github.io/wirebrain/"
Repository = "https://github.com/Saireddybv/wirebrain"
Documentation = "https://github.com/Saireddybv/wirebrain#quick-start"
Issues = "https://github.com/Saireddybv/wirebrain/issues"

[project.optional-dependencies]
capture = ["mitmproxy>=11,<12"]
memory = ["fastembed>=0.7,<0.10", "huggingface-hub>=0.20,<3.0"]

[project.scripts]
wirebrain = "wirebrain.cli:main"

[tool.setuptools.package-data]
wirebrain = ["static/*", "prompts/*.json", "prompts/*.md", "prompts/**/*.md", "prompts/**/*.json"]
