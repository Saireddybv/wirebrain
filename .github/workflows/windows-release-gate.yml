name: Windows capture release gate
on:
  push:
    branches: ['codex/rc-*']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teardown:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      WIREBRAIN_DISPOSABLE_RUNNER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install ".[capture]" playwright
      - name: Exercise teardown and verify fresh Chrome connections
        run: python scripts/run_windows_teardown_trial.py "$env:RUNNER_TEMP/wirebrain-gate"
      - name: Print synthetic results (never upload CA keys or profiles)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP/wirebrain-gate" -Filter stream-proof.json -Recurse | ForEach-Object { Get-Content $_.FullName }
          Get-ChildItem "$env:RUNNER_TEMP/wirebrain-gate" -Filter '*.log' -Recurse | Where-Object Name -in 'capture.log','driver-lifecycle.log' | ForEach-Object { Get-Content $_.FullName -Tail 20 }
