name: Windows desktop prototype
on:
  push:
    branches: [main, 'codex/windows-desktop-shell', 'codex/windows-download']
    paths: ['desktop/**', 'wirebrain/**', 'pyproject.toml', '.github/workflows/desktop-shell.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python desktop/prepare_runtime.py
      - run: python desktop/smoke.py
      - run: python -m pip install pywinauto pywin32
      - working-directory: desktop
        run: npx --yes --package @tauri-apps/cli@2.12.4 tauri build --bundles nsis
      - name: Install and remove unsigned prototype on disposable runner
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe
          $dest = Join-Path $env:LOCALAPPDATA WirebrainShellTrial
          $installed = Start-Process $installer.FullName -ArgumentList "/S /D=$dest" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installation failed" }
          & "$dest/runtime/python.exe" -I -c "import wirebrain.desktop; import mitmproxy_windows"
          if ($LASTEXITCODE) { throw "Installed runtime failed" }
          $shellExe = Get-ChildItem $dest -File -Filter '*.exe' | Where-Object Name -ne 'uninstall.exe'
          if (@($shellExe).Count -ne 1) { throw "Unexpected installed executable list" }
          $shell = Start-Process $shellExe.FullName -PassThru
          try {
            $limit = (Get-Date).AddSeconds(60)
            do {
              if ($shell.HasExited) { throw "Shell exited during startup" }
              $backend = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($shell.Id) and Name='python.exe'"
              if ($backend) {
                $listener = Get-NetTCPConnection -OwningProcess $backend.ProcessId -State Listen -ErrorAction SilentlyContinue |
                  Where-Object LocalAddress -eq '127.0.0.1' | Select-Object -First 1
              }
              if ($listener -and $shell.MainWindowTitle -eq 'Wirebrain') { break }
              Start-Sleep -Milliseconds 500
              $shell.Refresh()
            } while ((Get-Date) -lt $limit)
            if (!$listener -or $shell.MainWindowTitle -ne 'Wirebrain') { throw "No installed diary window or listener" }
            $stats = Invoke-RestMethod "http://127.0.0.1:$($listener.LocalPort)/api/stats" -NoProxy
            if ($stats.capture.running) { throw "First launch enabled capture" }
            python desktop/check_installed_controls.py $shell.Id $listener.LocalPort "$dest/runtime/python.exe"
            if ($LASTEXITCODE) { throw "Installed recording control check failed" }
          } finally {
            if (!$shell.HasExited) { $shell.Kill(); $shell.WaitForExit() }
          }
          $child = Get-Process -Id $backend.ProcessId -ErrorAction SilentlyContinue
          if ($child -and !$child.WaitForExit(15000)) { throw "Orphaned diary process" }
          $removed = Start-Process "$dest/uninstall.exe" -ArgumentList "/S _?=$dest" -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Uninstall failed" }
          if ((Test-Path "$dest/runtime/python.exe") -or !(Test-Path "$env:USERPROFILE/.wirebrain/memory.sqlite3")) { throw "Incorrect uninstall result" }
      - name: Prepare Windows tester download
        shell: pwsh
        run: |
          $bundle = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if ($bundle.Count -ne 1) { throw "Expected one tested installer" }
          $dir = New-Item -Type Directory "$env:RUNNER_TEMP/windows-download"
          $file = Join-Path $dir.FullName 'Wirebrain-Setup-x64.exe'
          Copy-Item -LiteralPath $bundle[0].FullName -Destination $file
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          "$hash  Wirebrain-Setup-x64.exe" | Set-Content -Encoding ascii "$dir/SHA256SUMS.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Wirebrain-Windows-x64
          path: ${{ runner.temp }}/windows-download/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
