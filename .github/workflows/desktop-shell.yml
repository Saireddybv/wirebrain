name: Windows desktop prototype
on:
  push:
    branches: ['codex/windows-desktop-shell']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python desktop/prepare_runtime.py
      - run: python desktop/smoke.py
      - working-directory: desktop
        run: npx --yes --package @tauri-apps/cli@2.12.4 tauri build --bundles nsis
      - name: Install and remove unsigned prototype on disposable runner
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe
          $dest = Join-Path $env:LOCALAPPDATA WirebrainShellTrial
          $installed = Start-Process $installer.FullName -ArgumentList "/S /D=$dest" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installation failed" }
          & "$dest/runtime/python.exe" -I -c "import wirebrain.desktop; import mitmproxy_windows"
          if ($LASTEXITCODE) { throw "Installed runtime failed" }
          $removed = Start-Process "$dest/uninstall.exe" -ArgumentList "/S" -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Uninstall failed" }
