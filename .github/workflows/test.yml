name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --check wirebrain/static/app.js
      - run: node --check wirebrain/static/workflows.js
      - name: Check public site metadata and links
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python scripts/check_site.py
      - run: node --check wirebrain/static/personal-memory.js
      - run: node --check wirebrain/static/reflect.js
      - run: node --check wirebrain/static/conversation-tools.js
      - run: node --check wirebrain/static/mcp-connections.js
  https-capture:
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install ".[capture]"
      - run: python -m unittest discover -s tests -p test_tls_capture.py -v
  memory-runtime:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install ".[capture,memory]"
      - run: python -m pip check
      - run: python -c "from fastembed import TextEmbedding; print('Local CPU embedding runtime imports successfully')"
  required-checks:
    name: Required checks
    if: ${{ always() }}
    needs: [test, https-capture, memory-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every required job succeeded
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Required jobs did not succeed: ' + ', '.join(failed))
              sys.exit(1)
          print('All required jobs passed.')
          PY
